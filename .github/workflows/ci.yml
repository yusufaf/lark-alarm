name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # assembleRelease runs R8, so a dependency that breaks minification fails
      # here. It can't catch code R8 strips that only fails at runtime; that
      # still needs the release APK run on a watch.
      - run: ./gradlew :core:test :app:assembleDebug :app:assembleRelease --console=plain
